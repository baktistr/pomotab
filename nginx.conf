# Cache policy by path. It lives in a `map` — rather than per-location
# `add_header` — because nginx drops every inherited `add_header` in any block
# that declares one of its own, which would silently strip the security headers
# below. One `add_header` set, at server level, applied everywhere.
# (conf.d/*.conf is included inside `http`, so `map` is legal here.)
map $uri $pomotab_cache_control {
    default       "no-cache";
    ~^/assets/    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No user data ever reaches this server, so there is nothing worth logging.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Hashed build output is immutable; the shell, the service worker and the
    # manifest must revalidate so a deploy actually rolls out.
    add_header Cache-Control $pomotab_cache_control always;

    # The app makes zero external requests, so the policy can be maximally
    # strict. Two allowances, both load-bearing:
    #   - the sha256 covers the theme bootstrap inlined in index.html, which has
    #     to run before first paint to avoid a flash; `npm run selftest` fails if
    #     that script changes without this hash being regenerated.
    #   - 'unsafe-inline' for styles is required by Radix (scroll-lock <style>)
    #     and Recharts (inline style attributes on SVG nodes).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qdSolr+1Cku/UdW2So/aNhaURKYlDB2knUHVhJrpD/Q='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # nginx's bundled mime.types has no entry for .webmanifest. A `types` block
    # does not cancel inherited `add_header`, so the headers above still apply.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # SPA fallback: /board and /activity are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
